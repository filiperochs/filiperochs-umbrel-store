version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: filiperochs-ofertas-db_odb-gateway_1
      APP_PORT: 80

  odb-pg:
    image: supabase/postgres:17.6.1.136
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/postgresql/data
      - ${APP_DATA_DIR}/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ${APP_DATA_DIR}/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

  odb-rest:
    image: postgrest/postgrest:v14.18
    restart: on-failure
    depends_on:
      odb-pg:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@odb-pg:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 5000
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}

  odb-auth:
    image: supabase/gotrue:v2.197.0
    restart: on-failure
    depends_on:
      odb-pg:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://umbrel.local:58101/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@odb-pg:5432/postgres
      GOTRUE_SITE_URL: http://umbrel.local:58101
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

  odb-storage:
    image: supabase/storage-api:v1.89.12
    restart: on-failure
    depends_on:
      odb-pg:
        condition: service_healthy
      odb-rest:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/data/storage:/var/lib/storage
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://odb-rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@odb-pg:5432/postgres
      STORAGE_PUBLIC_URL: http://umbrel.local:58101
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      # Limite duro por arquivo (fotos de post de grupo); o userbot tambem deve validar (ver BACKLOG)
      FILE_SIZE_LIMIT: 5242880
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: ofertas
      TENANT_ID: ofertas
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_ACCESS_KEY_SECRET}

  # postgres-meta: API de schema que o Studio usa (listar/alterar tabelas, roles, RLS).
  # Versao igual a do docker-compose oficial do Supabase (2026-11-23).
  odb-meta:
    image: supabase/postgres-meta:v0.100.1
    restart: on-failure
    init: true
    depends_on:
      odb-pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then((r) => {if (r.status !== 200) throw new Error(r.status)})"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: odb-pg
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  # Supabase Studio: editor de tabelas, editor de SQL, roles e politicas RLS.
  # Fica atras do login do Umbrel (gateway porta 80, location /). Sem Realtime/Edge Functions/Logs
  # neste stack: essas telas do Studio mostram erro, o resto funciona.
  odb-studio:
    image: supabase/studio:2026.11.23-sha-4a73166
    restart: on-failure
    init: true
    depends_on:
      odb-meta:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"]
      timeout: 10s
      interval: 10s
      retries: 5
      start_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/snippets:/app/snippets
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://odb-meta:8080
      POSTGRES_HOST: odb-pg
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 5000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: Ofertas do Kapitao
      DEFAULT_PROJECT_NAME: Ofertas DB
      SUPABASE_URL: http://odb-gateway:8000
      SUPABASE_PUBLIC_URL: http://umbrel.local:58101
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets

  odb-gateway:
    image: nginx:1.27-alpine
    restart: on-failure
    depends_on:
      - odb-rest
      - odb-auth
      - odb-storage
      - odb-studio
    ports:
      - "58101:8000"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      UMBREL_HOST_HINT: umbrel.local
      NGINX_ENVSUBST_FILTER: "^(POSTGRES_PASSWORD|ANON_KEY|SERVICE_ROLE_KEY|UMBREL_HOST_HINT)$$"
    # A config do nginx fica embutida aqui: o update do Umbrel substitui o compose, mas NAO
    # sobrescreve arquivos auxiliares ja existentes na pasta do app.
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/nginx/templates
        cat > /etc/nginx/templates/default.conf.template <<'NGX'
        # Se so veio o header apikey (sem Authorization), usa o apikey como bearer (o Kong do Supabase faz isso).
        map $$http_authorization $$bearer {
            default $$http_authorization;
            ""      "Bearer $$http_apikey";
        }

        # API (publicada no host, porta 58101): mesmos caminhos do supabase.co
        server {
            listen 8000;
            client_max_body_size 20m;
            # DNS dinamico: reresolve a cada 10s (container reiniciado muda de IP) e usa nomes unicos
            resolver 127.0.0.11 valid=10s ipv6=off;

            location /rest/v1/ {
                set $$up_rest http://odb-rest:3000;
                rewrite ^/rest/v1/(.*)$$ /$$1 break;
                proxy_pass $$up_rest;
                proxy_set_header Authorization $$bearer;
                proxy_set_header Host $$host;
            }
            location /auth/v1/ {
                set $$up_auth http://odb-auth:9999;
                rewrite ^/auth/v1/(.*)$$ /$$1 break;
                proxy_pass $$up_auth;
                proxy_set_header Host $$host;
            }
            location /storage/v1/ {
                client_max_body_size 6m;
                set $$up_storage http://odb-storage:5000;
                rewrite ^/storage/v1/(.*)$$ /$$1 break;
                proxy_pass $$up_storage;
                proxy_set_header Authorization $$bearer;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-Path /storage/v1;
            }
            location = /health { return 200 "ok\n"; }
            location / { return 404; }
        }

        # Upgrade de WebSocket para o Studio
        map $$http_upgrade $$connection_upgrade {
            default upgrade;
            ""      close;
        }

        # UI (atras do login do Umbrel via app_proxy): Studio em / e URLs/chaves em /keys
        server {
            listen 80;
            resolver 127.0.0.11 valid=10s ipv6=off;

            location = /keys {
                default_type text/plain;
                return 200 "Ofertas DB (Postgres + PostgREST + GoTrue + Storage + Studio)\n\nStudio:   abra a raiz deste app (/)\nAPI:      http://$${UMBREL_HOST_HINT}:58101\n          (de dentro de containers use o IP do Umbrel, ex. http://192.168.x.x:58101; umbrel.local nao resolve la)\nPostgres: somente rede interna do app (sem porta publicada no host)\n\nPOSTGRES_PASSWORD=$${POSTGRES_PASSWORD}\nANON_KEY=$${ANON_KEY}\nSERVICE_ROLE_KEY=$${SERVICE_ROLE_KEY}\n";
            }
            location / {
                set $$up_studio http://odb-studio:3000;
                proxy_pass $$up_studio;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_set_header Host $$host;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_read_timeout 300s;
            }
        }
        NGX
        exec /docker-entrypoint.sh nginx -g "daemon off;"
