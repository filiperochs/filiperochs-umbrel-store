version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: filiperochs-free-games-claimer_free-games-claimer_1
      APP_PORT: 7080

  free-games-claimer:
    image: ghcr.io/p-adamiec/free-games-claimer-remaster:v1.18@sha256:ca3a9d62fb894c4f4b03a05b0467d50144f6a084cf3a9844e4ee327fb8d604e6
    restart: unless-stopped
    tty: true
    stdin_open: true
    shm_size: 1gb
    # Credentials and settings live in ${APP_DATA_DIR}/data/config.env, which the app
    # loads on its own. On first start it is created from the upstream .env.example.
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /fgc/data && { [ -f /fgc/data/config.env ] || cp /fgc/.env.example /fgc/data/config.env; } && exec docker-entrypoint.sh "$$@"
      - --
    command: ["python3", "main.py"]
    volumes:
      - ${APP_DATA_DIR}/data:/fgc/data
